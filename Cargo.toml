[package]
name = "wlcg-token"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
thiserror = "2"
nix = { version = "0.31", features = ["user"] }
reqwest = { version = "0.13.1", optional = true }
reqwest-middleware = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }
http = { version = "1", optional = true }
anyhow = { version = "1", optional = true }
arc-swap = "1"
base64 = "0.23"
serde_json = "1"

[dev-dependencies]
temp-env = "0.3.6"

[features]
default = []
reqwest = ["dep:reqwest", "dep:reqwest-middleware", "dep:async-trait", "dep:http", "dep:anyhow"]
