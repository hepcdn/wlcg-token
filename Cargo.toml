[package]
name = "wlcg-token"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
thiserror = "2.0.20"
nix = { version = "0.31.3", features = ["user"] }
reqwest = { version = "0.13.4", optional = true }
reqwest-middleware = { version = "0.5.2", optional = true }
async-trait = { version = "0.1.92", optional = true }
http = { version = "1.5.0", optional = true }
anyhow = { version = "1.0.104", optional = true }
arc-swap = "1.9.2"
base64 = "0.23.1"
serde_json = "1.0.151"

[dev-dependencies]
temp-env = "0.3.6"

[features]
default = []
reqwest = ["dep:reqwest", "dep:reqwest-middleware", "dep:async-trait", "dep:http", "dep:anyhow"]
